<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bharadwaj AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a1a1a'/><text x='16' y='23' font-size='20' font-family='Georgia,serif' text-anchor='middle' fill='white'>B</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside id="side" class="side">
    <div class="side-top"><span class="logo">Bharadwaj AI</span>
      <button class="icon" id="closeSide" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <button class="new" id="newChat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <div class="search"><input id="search" placeholder="Search chats" autocomplete="off"></div>
    <button class="nav" id="openArts"><svg viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg>Artifacts</button>
    <div class="label">Recents</div>
    <div class="hist" id="hist"></div>
    <button class="nav" id="openSet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</button>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="off" id="off">You're offline</div>
    <header class="top">
      <button class="icon" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <span class="ttl" id="title">Bharadwaj AI</span>
      <button class="icon" id="newTop" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
    </header>
    <section class="chat" id="chat"><div class="wrap" id="msgs"></div></section>
    <footer class="foot"><div class="wrap">
      <div class="composer">
        <div class="files" id="files"></div>
        <textarea id="input" rows="1" placeholder="Message Bharadwaj AI"></textarea>
        <div class="bar">
          <div class="l">
            <button class="icon" id="plus" aria-label="Attach"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="pill" id="modelBtn"><span id="modelName"></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
          </div>
          <div class="r">
            <button class="icon" id="mic" aria-label="Voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
            <button class="send" id="send" disabled aria-label="Send"></button>
          </div>
        </div>
        <div class="pop plus" id="plusPop">
          <button data-in="#fileCam"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 012-2h2l1.5-2h5L16 6h2a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>Camera</button>
          <button data-in="#filePhoto"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>Photos &amp; videos</button>
          <button data-in="#fileAny"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5"/></svg>Files</button>
          <button data-in="#fileZip"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Project (zip)</button>
        </div>
        <div class="pop" id="pop"></div>
        <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
        <input type="file" id="filePhoto" accept="image/*,video/*" multiple hidden>
        <input type="file" id="fileAny" multiple hidden>
        <input type="file" id="fileZip" accept=".zip,application/zip" hidden>
      </div>
    </div></footer>
  </main>
</div>

<div class="viewer" id="viewer">
  <div class="vtop">
    <button class="icon" id="vClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="vt"><b id="vTitle"></b><small id="vSub"></small></div>
    <div class="seg"><button id="tPrev">Preview</button><button id="tCode">Code</button></div>
    <button class="icon" id="vDots" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
  </div>
  <div class="vfiles" id="vFiles"></div>
  <div class="vbody" id="vBody"></div>
  <div class="vmenu" id="vMenu"><button data-v="copy">Copy code</button><button data-v="dl">Download file</button><button data-v="zip" id="vZip">Download all (.zip)</button><button data-v="open">Open in browser</button></div>
</div>

<div class="lb" id="lb"><button class="icon" id="lbClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="lbBody"></div></div>

<div class="page" id="setPage">
  <div class="ptop"><button class="icon" id="setBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b>Settings</b><span style="width:44px"></span></div>
  <div class="pbody">
    <h4>Appearance</h4>
    <div class="cards" id="themeSeg">
      <button data-t="light" class="tcard"><i class="tl"></i>Light</button>
      <button data-t="system" class="tcard"><i class="ta"></i>Auto</button>
      <button data-t="dark" class="tcard"><i class="td"></i>Dark</button>
    </div>
    <p class="hint">Auto follows your device's light or dark mode.</p>
    <h4>Chat font</h4>
    <div class="fonts" id="fontSeg">
      <button data-f="default"><b>Aa</b><small>Default</small></button>
      <button data-f="serif"><b style="font-family:Georgia,serif">Aa</b><small>Serif</small></button>
      <button data-f="bold"><b style="font-weight:700">Aa</b><small>Bold</small></button>
      <button data-f="mono"><b style="font-family:ui-monospace,Menlo,monospace">Aa</b><small>Mono</small></button>
    </div>
    <h4>Text size</h4>
    <div class="sizes" id="sizeSeg"><button data-s="s">Small</button><button data-s="m">Default</button><button data-s="l">Large</button><button data-s="xl">Huge</button></div>
    <h4>Default model</h4>
    <div class="list" id="modelList"></div>
    <h4>Data</h4>
    <button class="dbtn wide" id="clearAll">Delete all chats</button>
    <p class="sfoot">Bharadwaj AI · API keys stay safely in your Cloudflare Worker.</p>
  </div>
</div>
<div class="sheet" id="artSheet"><div class="sc">
  <div class="sh"><b>Artifacts</b><button class="icon" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="artList"></div>
</div></div>

<div class="modal" id="modal"><div class="card"><h3>Start a new chat?</h3><p>Your current chat stays saved in history.</p><div class="row"><button class="ghost" id="stay">Stay in chat</button><button class="solid" id="go">Start new chat</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
