<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bharadwaj AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a1a1a'/><text x='16' y='23' font-size='20' font-family='Georgia,serif' text-anchor='middle' fill='white'>B</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside id="side" class="side">
    <div class="side-top">
      <span class="logo">Bharadwaj AI</span>
      <button class="icon" id="closeSide" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="new" id="newChat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <div class="search"><input id="search" placeholder="Search chats" autocomplete="off"></div>
    <div class="label">Recents</div>
    <div class="hist" id="hist"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">
      <button class="icon" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <select id="provider" aria-label="Model">
        <option value="nara">Nara · Auto</option>
        <option value="groq">Groq</option>
        <option value="gemini">Gemini</option>
      </select>
      <button class="icon" id="newTop" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
    </header>
    <section class="chat" id="chat"><div class="wrap" id="msgs"></div></section>
    <footer class="foot">
      <div class="wrap">
        <div class="files" id="files"></div>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Message Bharadwaj AI"></textarea>
          <div class="bar">
            <label class="icon plus" aria-label="Attach files"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><input type="file" id="file" multiple hidden></label>
            <button class="send" id="send" disabled aria-label="Send"></button>
          </div>
        </div>
        <p class="note">Bharadwaj AI can make mistakes. Please double-check important information.</p>
      </div>
    </footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
