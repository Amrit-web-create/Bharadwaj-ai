<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bharadwaj AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<div class="app">
  <aside id="side" class="side">
    <div class="side-top">
      <div class="brand"><span class="orb sm"></span><b>Bharadwaj AI</b></div>
      <button class="icon" id="closeSide" aria-label="Close menu">✕</button>
    </div>
    <button class="new" id="newChat">＋ New chat</button>
    <div class="search"><input id="search" placeholder="Search chats" autocomplete="off"></div>
    <div class="hist" id="hist"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">
      <button class="icon" id="menu" aria-label="Menu">☰</button>
      <div class="model"><select id="provider" aria-label="Model">
        <option value="nara">Bharadwaj · Nara</option>
        <option value="grok">Bharadwaj · Grok</option>
        <option value="gemini">Bharadwaj · Gemini</option>
      </select></div>
      <button class="icon" id="newTop" aria-label="New chat">✎</button>
    </header>
    <section class="chat" id="chat"><div class="wrap" id="msgs"></div></section>
    <footer class="foot">
      <div class="wrap">
        <div class="files" id="files"></div>
        <div class="composer">
          <label class="icon plus" aria-label="Attach files">＋<input type="file" id="file" multiple hidden></label>
          <textarea id="input" rows="1" placeholder="Message Bharadwaj AI"></textarea>
          <button class="send" id="send" disabled aria-label="Send">↑</button>
        </div>
        <p class="note">Bharadwaj AI can make mistakes. Check important info.</p>
      </div>
    </footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
