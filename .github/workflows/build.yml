name: Build Sanatan Wallpaper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK, release APK and AAB
        run: gradle assembleDebug assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/SanatanWallpaper-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/SanatanWallpaper-release.apk
          cp app/build/outputs/bundle/release/*.aab dist/SanatanWallpaper-release.aab
          ls -lh dist
          echo "### Build finished" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: SanatanWallpaper-build
          path: dist/*
          if-no-files-found: error

      - name: Upload reports (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports
          if-no-files-found: ignore
